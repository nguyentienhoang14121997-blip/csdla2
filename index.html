<style>
:root{
  --ink:#1c2333; --ink2:#3d4560; --paper:#f5f3ee; --card:#ffffff;
  --line:#e4ddd4; --navy:#7a1733; --navy2:#9c2847; --maroon:#7a1733; --maroon2:#5c1227; --amber:#c8862b;
  --amberbg:#fbeedc; --good:#2f7d4f; --bad:#b2402d; --shadow:rgba(28,35,51,.1);
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ink:#eae7dd;--ink2:#c3c2ba;--paper:#171a20;--card:#1f232b;--line:#333844;--navy:#c4607f;--navy2:#d98aa3;--maroon:#7a1733;--maroon2:#5c1227;--amber:#e0a955;--amberbg:#3a2f1c;--shadow:rgba(0,0,0,.35);}
}
:root[data-theme="dark"]{--ink:#eae7dd;--ink2:#c3c2ba;--paper:#171a20;--card:#1f232b;--line:#333844;--navy:#c4607f;--navy2:#d98aa3;--maroon:#7a1733;--maroon2:#5c1227;--amber:#e0a955;--amberbg:#3a2f1c;--shadow:rgba(0,0,0,.35);}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Be Vietnam Pro',-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
h1,h2,h3{font-family:'Noto Serif',Georgia,"Times New Roman",serif;font-weight:600;margin:0 0 4px}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top1{background:linear-gradient(90deg,var(--maroon2),var(--maroon) 55%,var(--navy2));color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top1 .brandwrap{display:flex;align-items:center;gap:10px;min-width:0}
.top1 .logo{font-size:22px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.top1 .brand{font-family:'Noto Serif',Georgia,serif;font-size:16px;font-weight:700;letter-spacing:.02em;color:var(--amber);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top1 .sub{font-size:10.5px;color:rgba(255,255,255,.75);letter-spacing:.03em}
.top1 .badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:7px;padding:5px 11px;font-size:11.5px;white-space:nowrap}
.top .who{font-size:12.5px;opacity:.92;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.top button:hover{background:rgba(255,255,255,.22)}
.top2{background:var(--card);border-bottom:1px solid var(--line);padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px var(--shadow)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.top2 .tabs{padding:8px 0}
.tab{padding:9px 13px;border-radius:7px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink2);border-bottom:2.5px solid transparent;transition:background .12s}
.tab:hover{background:var(--paper)}
.tab.active{background:var(--amberbg);color:var(--maroon2);border-bottom-color:var(--maroon)}
.wrap .tabs{margin:16px 0}
.tabs.sub{margin-top:2px;background:var(--paper);border-radius:9px;padding:4px;display:inline-flex}
.tabs.sub .tab{font-size:12px;padding:6px 12px;border-radius:6px;border-bottom:none}
.tabs.sub .tab.active{background:var(--card);box-shadow:0 1px 3px var(--shadow);border-bottom:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--ink2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em}
tbody tr:nth-child(even) td{background:rgba(0,0,0,.015)}
tr:hover td{background:rgba(35,49,80,.05)}
.tbl-wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.pill.good{background:#e4f2e8;color:var(--good)}
.pill.bad{background:#f6e3de;color:var(--bad)}
.pill.mid{background:var(--amberbg);color:var(--amber)}
button.btn{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:13.5px;cursor:pointer}
button.btn.sec{background:transparent;color:var(--navy);border:1px solid var(--navy)}
button.btn.danger{background:var(--bad)}
button.btn:disabled{opacity:.5;cursor:default}
button.link{background:none;border:none;color:var(--navy2);cursor:pointer;font-size:13px;text-decoration:underline;padding:2px}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);width:100%}
label{font-size:12px;color:var(--ink2);display:block;margin-bottom:3px}
.field{margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{padding:40px 16px;text-align:center}
.hero h1{font-size:30px}
.rolecards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:640px;margin:24px auto 0}
@media(max-width:640px){.rolecards{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
@media(max-width:600px){
  .wrap{padding:14px 10px 60px}
  .top1{padding:9px 12px;flex-wrap:wrap;row-gap:6px}
  .top1 .brand{font-size:13.5px}
  .top1 .sub{font-size:9.5px}
  .top1 .logo{font-size:18px}
  .top1 .badge{display:none}
  .top .who{font-size:11px;gap:6px;flex-wrap:wrap}
  .top button{padding:4px 8px;font-size:11.5px}
  .top2{padding:0 8px}
  .top2 .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .top2 .tab{white-space:nowrap}
  h1{font-size:21px}
  h1,h2{word-break:break-word}
  h2{font-size:18px}
  h3{font-size:15.5px}
  .card{padding:12px}
  .tabs{gap:5px}
  .tab{padding:7px 10px;font-size:12px}
  .tabs.sub .tab{font-size:11px;padding:5px 9px}
  table{font-size:12px}
  th,td{padding:7px 8px}
  .score{font-size:26px}
  .modal{padding:14px;max-width:94vw}
  button.btn,button.btn.sec,button.btn.danger{padding:9px 12px;font-size:13px}
  .link{padding:3px 4px;display:inline-block}
  input,select,textarea{font-size:16px}
  .tbl-wrap{-webkit-overflow-scrolling:touch}
  .rolecard{padding:14px}
}
.rolecard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;cursor:pointer;text-align:left}
.rolecard:hover{border-color:var(--navy)}
.rolecard b{font-family:'Noto Serif',Georgia,serif;font-size:16px;display:block;margin-bottom:4px}
.rolecard span{font-size:12.5px;color:var(--ink2)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--card);border-radius:10px;padding:20px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
.muted{color:var(--ink2);font-size:12.5px}
.score{font-size:34px;font-family:'Noto Serif',Georgia,serif;font-weight:700}
.err{color:var(--bad);font-size:12.5px;margin-top:4px}
.actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.hint{font-size:12px;color:var(--ink2);margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--good);color:#fff;padding:11px 20px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:60;font-size:13.5px;font-weight:600;max-width:90vw;text-align:center}
</style>

async function importStudentsXlsx(file, db, onDone){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  let ok=0, skip=0;
  for(const r of rows){
    const ma = String(r['Mã định danh']||'').trim();
    if(!ma){ skip++; continue; }
    const snap = await db.doc('students/'+ma).get();
    const base = snap.exists ? snap.data() : {};
    const data = {...base, ma,
      stt: r['STT']!==undefined ? r['STT'] : base.stt,
      ten: r['Họ và tên'] || base.ten || '',
      ngaysinh: r['Ngày sinh'] || base.ngaysinh || '',
      gioitinh: r['Giới tính'] || base.gioitinh || '',
      to: r['Tổ']!==undefined ? r['Tổ'] : base.to,
      sdt: r['SĐT liên hệ']!==undefined ? String(r['SĐT liên hệ']) : base.sdt,
      chucvu: r['Chức vụ']!==undefined ? (CV_LABEL_REV[r['Chức vụ']]||'') : base.chucvu,
      dantoc: r['Dân tộc'] || base.dantoc || '',
      trangthai: r['Trạng thái'] || base.trangthai || 'Đang học',
    };
    await db.doc('students/'+ma).set(data);
    ok++;
  }
  await onDone();
  alert('Đã nhập '+ok+' học sinh. Bỏ qua '+skip+' dòng thiếu "Mã định danh".');
}

const DEFAULT_WEEK_START = '2026-09-07';
function addDays(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function genDefaultWeeks(start, count){
  const list=[]; let s=start;
  for(let i=0;i<count;i++){ const e=addDays(s,6); list.push({start:s, end:e}); s=addDays(e,1); }
  return list;
}
function weekRangeOf(n, weeks){ return (weeks && weeks[n-1]) || null; }
function weekNumberOfDate(dateStr, weeks){
  if(!dateStr || !weeks) return null;
  for(let i=0;i<weeks.length;i++){ if(dateStr>=weeks[i].start && dateStr<=weeks[i].end) return i+1; }
  return null;
}
function weeksStartingInMonth(monthStr, weeks){
  const res=[]; (weeks||[]).forEach((w,i)=>{ if(w.start.slice(0,7)===monthStr) res.push(i+1); }); return res;
}
function weekScore(ma, weekNum, violations, weeks){
  const r=weekRangeOf(weekNum, weeks); if(!r) return 100;
  let t=100;
  violations.filter(v=>v.ma===ma && v.date>=r.start && v.date<=r.end).forEach(v=>t+=v.diem);
  return t;
}
// Xếp hạng kiểu thi đấu: điểm bằng nhau thì hạng bằng nhau, hạng sau bị bỏ qua số tương ứng
function withRank(list, scoreKey){
  const sorted=[...list].sort((a,b)=>b[scoreKey]-a[scoreKey]);
  let rank=0, prev=null;
  return sorted.map((x,i)=>{ if(x[scoreKey]!==prev){ rank=i+1; prev=x[scoreKey]; } return {...x, rank}; });
}
// Năm học 2026-2027: HK1 = T9→T1, HK2 = T2→T5
const SEMESTERS = {
  HK1: ['2026-09','2026-10','2026-11','2026-12'],
  HK2: ['2027-01','2027-02','2027-03','2027-04','2027-05'],
};
function monthOf(dateStr){ return dateStr ? dateStr.slice(0,7) : null; }
function monthAvg(ma, monthStr, violations, weeks){
  const ns = weeksStartingInMonth(monthStr, weeks);
  if(!ns.length) return 100;
  const scores = ns.map(n=>weekScore(ma,n,violations,weeks));
  return scores.reduce((a,b)=>a+b,0)/scores.length;
}
function prevMonthStr(ym){ let [y,m]=ym.split('-').map(Number); m--; if(m===0){ m=12; y--; } return y+'-'+String(m).padStart(2,'0'); }
// Xếp hạng của tháng liền trước (null nếu là tháng 9 hoặc chưa có dữ liệu để so sánh)
function prevRanks(students, month, violations, weeks){
  if(!month || parseInt(month.split('-')[1],10)===9) return null;
  const prev = prevMonthStr(month);
  if(!violations.some(v=>monthOf(v.date)===prev) || !violations.some(v=>monthOf(v.date)===month)) return null;
  const list = students.map(s=>({ma:s.ma, avg:monthAvg(s.ma, prev, violations, weeks)}));
  const map = {}; withRank(list,'avg').forEach(x=>{ map[x.ma]=x.rank; });
  return map;
}
function bacValue(prevMap, ma, rank){ return (prevMap && prevMap[ma]!==undefined) ? prevMap[ma]-rank : null; }
function bacText(n){ return n===null ? '' : (n>0 ? '+'+n : String(n)); }
function Bac({n}){
  if(n===null || n===undefined) return <span className="muted">—</span>;
  if(n>0) return <b style={{color:'var(--good)'}}>▲ {n}</b>;
  if(n<0) return <b style={{color:'var(--bad)'}}>▼ {-n}</b>;
  return <span>0</span>;
}

function saveSession(s){ try{ localStorage.setItem('qlhs_session', JSON.stringify(s)); }catch(e){} }

const ADMIN_PASSWORD = 'gvcn2026';

function Login({db, onLogin}){
  const [picking,setPicking] = useState(null);
  const [students,setStudents] = useState([]);
  const [phone,setPhone] = useState('');
  const [pw,setPw] = useState('');
  const [showPw,setShowPw] = useState(false);
  const [err,setErr] = useState('');

  async function choose(role){
    setErr(''); setPw(''); setPhone('');
    if(role==='admin'){ setStudents([]); setPicking('admin'); return; }
    const snap = await db.collection('students').get();
    let list = snap.docs.map(d=>d.data()).sort((a,b)=>a.stt-b.stt);
    if(role==='cb') list = list.filter(s=>s.chucvu);
    setStudents(list);
    setPicking(role);
  }

  function findByPhone(role, p){
    const ph = p.trim();
    if(!ph) return null;
    if(role==='ph') return students.find(s=>s.sdt===ph || s.sdtcha===ph || s.sdtme===ph);
    return students.find(s=>s.sdt===ph);
  }

  async function submit(){
    setErr('');
    if(picking==='admin'){
      const adminDoc = await db.doc('meta/admin').get();
      const pwReal = (adminDoc.exists && adminDoc.data().pw) || ADMIN_PASSWORD;
      if(pw!==pwReal){ setErr('Sai mật khẩu.'); return; }
      onLogin({role:'admin', first: pw===ADMIN_PASSWORD}); return;
    }
    const s = findByPhone(picking, phone);
    if(!s){ setErr('Không tìm thấy số điện thoại này trong danh sách lớp. Vui lòng kiểm tra lại hoặc liên hệ GVCN.'); return; }
    const need = picking==='ph' ? (s.pw_ph||'') : (s.pw_hs||'');
    if(pw!==need){ setErr('Sai mật khẩu.'); return; }
    const defPw = picking==='ph' ? (s.sdt||'') : ((s.ngaysinh||'').replace(/\//g,''));
    onLogin({role: picking==='ph'?'ph':picking, ma:s.ma, first: pw===defPw});
  }

  return (
    <div>
      <div className="top"><div className="top1">
        <div className="brandwrap"><span className="logo">🎓</span><div><div className="brand">CSDL Lớp 11A2</div><div className="sub">THPT Cao Bá Quát – Quốc Oai</div></div></div>
        <div className="badge">Năm học 2026–2027</div>
      </div></div>
      <div className="wrap hero">
        <h1>Chọn vai trò đăng nhập</h1>
        <p className="muted">THPT Cao Bá Quát — Quốc Oai · Năm học 2026–2027</p>
        <div className="rolecards">
          <div className="rolecard" onClick={()=>choose('admin')}><b>Giáo viên chủ nhiệm</b><span>Toàn quyền: thêm/sửa/xoá học sinh, điểm danh, ghi lỗi, phân công cán bộ lớp.</span></div>
          <div className="rolecard" onClick={()=>choose('cb')}><b>Cán bộ lớp</b><span>Lớp trưởng, Bí thư (toàn lớp) hoặc Tổ trưởng (riêng tổ mình) — quản lý điểm danh và ghi lỗi nề nếp.</span></div>
          <div className="rolecard" onClick={()=>choose('hs')}><b>Học sinh</b><span>Xem thông tin và kết quả nề nếp của bản thân.</span></div>
          <div className="rolecard" onClick={()=>choose('ph')}><b>Phụ huynh</b><span>Theo dõi chuyên cần và nề nếp của con.</span></div>
        </div>
        {picking && (
          <div className="card" style={{maxWidth:420,margin:'22px auto 0',textAlign:'left'}}>
            {picking!=='admin' && (students.length ? (
              <>
                <label>{picking==='ph'?'Số điện thoại phụ huynh (cha, mẹ hoặc liên hệ)':'Số điện thoại liên hệ của bạn'}</label>
                <input type="tel" inputMode="numeric" placeholder="VD: 0912345678" value={phone} onChange={e=>setPhone(e.target.value)}/>
              </>
            ) : <p className="hint">Giáo viên chưa phân công cán bộ lớp nào. Vui lòng liên hệ GVCN.</p>)}
            {(picking==='admin' || students.length>0) && <>
              <div className="field" style={{marginTop:10}}><label>Mật khẩu</label>
                <div style={{position:'relative'}}>
                  <input type={showPw?'text':'password'} value={pw} style={{paddingRight:38}} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}/>
                  <button type="button" onClick={()=>setShowPw(v=>!v)} style={{position:'absolute',right:4,top:4,bottom:4,background:'none',border:'none',cursor:'pointer',fontSize:17,padding:'0 6px'}}>{showPw?'🙈':'👁️'}</button>
                </div>
              </div>
              {err && <div className="err">{err}</div>}
              <div className="actions"><button className="btn" onClick={submit}>Đăng nhập</button></div>
            </>}
          </div>
        )}
      </div>
    </div>
  );
}

function Modal({modal, onClose, onSave, err, rules}){
  const [form,setForm] = useState(()=>{
    if(modal && modal.type==='logViolation'){
      const c = modal.edit?.count || 1;
      const perUnit = modal.edit ? Math.round((modal.edit.diem||0)/c) : -10;
      return {text:modal.edit?.text||'', diem:perUnit, count:c, date:modal.edit?.date||modal.defaultDate||new Date().toISOString().slice(0,10), note:modal.edit?.note||''};
    }
    return modal && modal.type==='editStudent' ? {...modal.data} : {};
  });
  const [sp1,setSp1] = useState(false);
  const [sp2,setSp2] = useState(false);
  const [saving,setSaving] = useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  async function doSave(payload){
    if(saving) return;
    setSaving(true);
    try{ await onSave(payload); } finally { setSaving(false); }
  }
  if(!modal) return null;

  let body=null;
  if(modal.type==='logViolation'){
    body = <>
      <h3>{modal.edit?'Sửa ghi nhận':'Ghi nhận'}: {modal.student.ten}</h3>
      <div className="field"><label>Loại</label>
        <select onChange={e=>{ const r=rules.find(x=>x.code===e.target.value); if(r) setForm(f=>({...f,text:r.text,diem:r.diem,count:1})); }}>
          <option value="">— Tuỳ chọn khác —</option>
          {rules.map(r=><option key={r.code} value={r.code}>{r.code} - {r.diem>0?'+':''}{r.diem} - {r.text}</option>)}
        </select>
      </div>
      <div className="field"><label>Nội dung</label><input value={form.text} onChange={e=>set('text',e.target.value)} placeholder="Nội dung ghi nhận"/></div>
      <div className="row2">
        <div className="field"><label>Điểm mỗi lần (+/-)</label><input type="number" value={form.diem} onChange={e=>set('diem',parseInt(e.target.value,10))}/></div>
        <div className="field"><label>Số lần vi phạm</label><input type="number" min="1" value={form.count} onChange={e=>set('count', Math.max(1, parseInt(e.target.value,10)||1))}/></div>
      </div>
      <p className="hint">Tổng điểm sẽ ghi: <b style={{color:(form.diem*form.count)<0?'var(--bad)':'var(--good)'}}>{(form.diem*form.count)>0?'+':''}{form.diem*form.count}</b>{form.count>1?' ('+form.diem+' × '+form.count+' lần)':''}</p>
      <div className="field"><label>Ngày</label><input type="date" value={form.date} onChange={e=>set('date',e.target.value)}/></div>
      <div className="field"><label>Ghi chú (không bắt buộc)</label><input value={form.note} onChange={e=>set('note',e.target.value)}/></div>
      {err && <div className="err">{err}</div>}
      <div className="actions"><button className="btn sec" onClick={onClose} disabled={saving}>Huỷ</button><button className="btn" onClick={()=>doSave(form)} disabled={saving}>{saving?'Đang lưu…':'Lưu'}</button></div>
    </>;
  } else if(modal.type==='editStudent'){
    body = <>
      <h3>{modal.ma?'Sửa':'Thêm'} học sinh</h3>
      <div className="field"><label>Họ tên</label><input value={form.ten||''} onChange={e=>set('ten',e.target.value)}/></div>
      <div className="row2">
        <div className="field"><label>Mã định danh</label><input value={form.ma||''} disabled={!!modal.ma} onChange={e=>set('ma',e.target.value)}/></div>
        <div className="field"><label>Tổ</label><input type="number" value={form.to??''} onChange={e=>set('to',parseInt(e.target.value,10)||null)}/></div>
      </div>
      <div className="row2">
        <div className="field"><label>Giới tính</label>
          <select value={form.gioitinh||'Nam'} onChange={e=>set('gioitinh',e.target.value)}><option>Nam</option><option>Nữ</option></select>
        </div>
        <div className="field"><label>Ngày sinh</label><input value={form.ngaysinh||''} placeholder="dd/mm/yyyy" onChange={e=>set('ngaysinh',e.target.value)}/></div>
      </div>
      <div className="field"><label>SĐT liên hệ</label><input value={form.sdt||''} onChange={e=>set('sdt',e.target.value)}/></div>
      <div className="row2">
        <div className="field"><label>Họ tên cha</label><input value={form.tencha||''} onChange={e=>set('tencha',e.target.value)}/></div>
        <div className="field"><label>SĐT cha</label><input value={form.sdtcha||''} onChange={e=>set('sdtcha',e.target.value)}/></div>
      </div>
      <div className="row2">
        <div className="field"><label>Họ tên mẹ</label><input value={form.tenme||''} onChange={e=>set('tenme',e.target.value)}/></div>
        <div className="field"><label>SĐT mẹ</label><input value={form.sdtme||''} onChange={e=>set('sdtme',e.target.value)}/></div>
      </div>
      <div className="field"><label>Chức vụ cán bộ lớp</label>
        <select value={form.chucvu||''} onChange={e=>set('chucvu',e.target.value)}>
          <option value="">— Học sinh thường —</option>
          <option value="lop_truong">Lớp trưởng</option>
          <option value="bi_thu">Bí thư</option>
          <option value="to_truong">Tổ trưởng</option>

      </div>
      <div className="field"><label>Dân tộc</label><input value={form.dantoc||''} onChange={e=>set('dantoc',e.target.value)}/></div>
      <div className="field"><label>Trạng thái</label><input value={form.trangthai||'Đang học'} onChange={e=>set('trangthai',e.target.value)}/></div>

    </>;
  } else if(modal.type==='viewStudent'){
    const s=modal.data;
    body = <>
      <h3>{s.ten}</h3>
      <p className="muted">Mã: {s.ma} · Tổ {s.to??'-'} · {s.gioitinh||''} · Sinh {s.ngaysinh||''} · SĐT {s.sdt||'-'}</p>
      <p className="muted">Cha: {s.tencha||'-'} ({s.sdtcha||'-'}) · Mẹ: {s.tenme||'-'} ({s.sdtme||'-'})</p>
      <p><span className="score">{modal.total}</span></p>
      <div className="tbl-wrap" style={{maxHeight:260}}><table><thead><tr><th>Ngày</th><th>Nội dung</th><th>Điểm</th></tr></thead><tbody>
        {modal.myV.length? modal.myV.map(v=><tr key={v.id}><td>{viDate(v.date)}</td><td>{v.text}</td><td>{v.diem>0?'+':''}{v.diem}</td></tr>) : <tr><td colSpan="3" className="muted">Chưa có ghi nhận</td></tr>}
      </tbody></table></div>
      <div className="actions">
        {modal.canEdit && <button className="btn sec" onClick={()=>doSave({__editProfile:true})} disabled={saving}>Sửa hồ sơ</button>}
        <button className="btn sec" onClick={onClose}>Đóng</button>
      </div>
    </>;
  } else if(modal.type==='confirmDel'){
    body = <>
      <h3>Xoá học sinh?</h3>
      <p className="muted">{modal.data.ten} sẽ bị xoá khỏi danh sách. Thao tác không thể hoàn tác.</p>
      <div className="actions"><button className="btn sec" onClick={onClose} disabled={saving}>Huỷ</button><button className="btn danger" onClick={()=>doSave(null)} disabled={saving}>{saving?'Đang xoá…':'Xoá'}</button></div>
    </>;
  } else if(modal.type==='changePassword'){
    body = <>
      <h3>Đổi mật khẩu</h3>
      {modal.first && <p className="muted">Bạn đang dùng mật khẩu mặc định. Vui lòng đổi mật khẩu mới để bảo mật (có thể bấm Huỷ để đổi sau).</p>}
      <div className="field"><label>Mật khẩu hiện tại</label><input type="password" value={form.cur||''} onChange={e=>set('cur',e.target.value)}/></div>

          <input type={sp1?'text':'password'} value={form.next||''} style={{paddingRight:38}} onChange={e=>set('next',e.target.value)}/>

        </div>
      </div>

    </>;

  return <div className="overlay" onMouseDown={e=>{if(e.target.className==='overlay') onClose();}}><div className="modal">{body}</div></div>;

function App(){
  const [db,setDb] = useState(null);
  const [session,setSession] = useState(loadSession());
  const [students,setStudents] = useState([]);
  const [violations,setViolations] = useState([]);
  const [attendance,setAttendance] = useState([]);
  const [tab,setTab] = useState('list');
  const [tdView,setTdView] = useState('week');
  const [tkView,setTkView] = useState('month');
  const [modal,setModal] = useState(null);
  const [modalSeq,setModalSeq] = useState(0);
  function openModal(m){ setModalSeq(n=>n+1); setModal(m); }
  const [err,setErr] = useState('');
  const [nudge,setNudge] = useState(false);
  useEffect(()=>{ if(nudge && db){ openModal({type:'changePassword', first:true}); setNudge(false); } },[nudge,db]);
  const [weeks,setWeeks] = useState([]);
  const [rulesList,setRulesList] = useState(DEFAULT_RULES);
  const [toast,setToast] = useState('');
  function showToast(msg){ setToast(msg); setTimeout(()=>setToast(cur=>cur===msg?'':cur), 2200); }

  useEffect(()=>{
    (async ()=>{
      const d = firebase.firestore();
      const meta = await d.doc('meta/seed').get();
      if(!meta.exists || !meta.data() || !meta.data().done){
        for(const s of SEED_STUDENTS){ await d.doc('students/'+s.ma).set(s); }
        await d.doc('meta/seed').set({done:true, at:Date.now()});
      }
      const bf = await d.doc('meta/backfill_profile_v1').get();
      if(!bf.exists){
        for(const s of SEED_STUDENTS){
          try{ await d.doc('students/'+s.ma).update({tencha:s.tencha, tenme:s.tenme, sdtcha:s.sdtcha, sdtme:s.sdtme}); }catch(e){}
        }
        await d.doc('meta/backfill_profile_v1').set({done:true, at:Date.now()});
      }
      const bf2 = await d.doc('meta/backfill_profile_v2').get();
      if(!bf2.exists){
        for(const s of SEED_STUDENTS){
          try{ await d.doc('students/'+s.ma).update({pw_hs:s.pw_hs, pw_ph:s.pw_ph}); }catch(e){}
        }
        await d.doc('meta/backfill_profile_v2').set({done:true, at:Date.now()});
      }
      const wk = await d.doc('meta/weeks').get();
      if(!wk.exists || !wk.data() || !wk.data().list || !wk.data().list.length){
        const list = genDefaultWeeks(DEFAULT_WEEK_START, 40);
        await d.doc('meta/weeks').set({list});
        setWeeks(list);
      } else {
        setWeeks(wk.data().list);
      }
      const ru = await d.doc('meta/rules').get();
      if(!ru.exists || !ru.data() || !ru.data().list || !ru.data().list.length){
        await d.doc('meta/rules').set({list: DEFAULT_RULES});
        setRulesList(DEFAULT_RULES);
      } else {
        setRulesList(ru.data().list);
      }
      setDb(d);
    })();
  },[]);

  async function saveWeeks(list){
    await db.doc('meta/weeks').set({list});
    setWeeks(list);
    showToast('Đã lưu cấu hình tuần học ✓');
  }
  async function saveRules(list){
    await db.doc('meta/rules').set({list});
    setRulesList(list);
    showToast('Đã lưu danh mục lỗi ✓ — áp dụng cho mọi tài khoản');
  }
  async function refresh(d){
    const dd = d||db;
    const [ss,vs,as] = await Promise.all([dd.collection('students').get(), dd.collection('violations').get(), dd.collection('attendance').get()]);
    setStudents(ss.docs.map(x=>x.data()).sort((a,b)=>a.stt-b.stt));
    setViolations(vs.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.at||0)-(a.at||0)));
    setAttendance(as.docs.map(x=>x.data()));
  }

  useEffect(()=>{ if(db) refresh(db); }, [db]);

  function login(s){ const {first,...rest}=s; setSession(rest); saveSession(rest); if(first) setNudge(true); }
  function logout(){ setSession(null); saveSession(null); }

  async function handleSave(form){
    setErr('');
    try{
    if(modal.type==='logViolation'){
      if(!form.text || isNaN(form.diem)){ setErr('Vui lòng nhập nội dung và điểm hợp lệ.'); return; }
      if(!form.count || form.count<1){ setErr('Số lần vi phạm phải từ 1 trở lên.'); return; }
      if(!form.date){ setErr('Vui lòng chọn ngày.'); return; }
      const total = form.diem*form.count;
      if(modal.edit){
        const updated={ma:modal.student.ma, text:form.text, diem:total, count:form.count, date:form.date, note:form.note||'', by:session.role, at:modal.edit.at||Date.now()};
        await db.doc('violations/'+modal.edit.id).set(updated);
        setViolations(vs=>vs.map(v=>v.id===modal.edit.id?{id:modal.edit.id,...updated}:v));
      } else {
        const payload={ma:modal.student.ma, text:form.text, diem:total, count:form.count, date:form.date, note:form.note||'', by:session.role, at:Date.now()};
        const ref = await db.collection('violations').add(payload);
        setViolations(vs=>[{id:ref.id, ...payload}, ...vs]);
      }
      setModal(null); showToast('Đã lưu ✓ '+modal.student.ten+' — '+(total>0?'+':'')+total+' điểm'+(form.count>1?' (×'+form.count+')':''));
    } else if(modal.type==='editStudent'){
      if(!form.ten || !form.ma){ setErr('Vui lòng nhập họ tên và mã định danh.'); return; }
      const data={...form, stt: (modal.data&&modal.data.stt) || (students.length+1)};
      await db.doc('students/'+form.ma).set(data);
      setModal(null); await refresh();
    } else if(modal.type==='confirmDel'){
      await db.doc('students/'+modal.data.ma).delete();
      setModal(null); await refresh();
    } else if(modal.type==='viewStudent' && form && form.__editProfile){
      openModal({type:'editStudent', ma:modal.data.ma, data:modal.data});
    } else if(modal.type==='changePassword'){
      if(!form.next || form.next.length<4){ setErr('Mật khẩu mới phải có ít nhất 4 ký tự.'); return; }
      if(!/\p{Lu}/u.test(form.next)){ setErr('Mật khẩu mới phải có ít nhất 1 chữ cái viết in hoa.'); return; }
      if(!/[^\p{L}\p{N}\s]/u.test(form.next)){ setErr('Mật khẩu mới phải có ít nhất 1 ký tự đặc biệt (ví dụ: ! @ # $ % &).'); return; }
      if(form.next!==form.next2){ setErr('Mật khẩu nhập lại không khớp.'); return; }
      if(session.role==='admin'){
        const adminDoc = await db.doc('meta/admin').get();
        const pwReal = (adminDoc.exists && adminDoc.data().pw) || ADMIN_PASSWORD;
        if(form.cur!==pwReal){ setErr('Mật khẩu hiện tại không đúng.'); return; }
        await db.doc('meta/admin').set({pw:form.next});
      } else {
        const field = session.role==='ph' ? 'pw_ph' : 'pw_hs';
        const me2 = students.find(x=>x.ma===session.ma);
        if(!me2 || form.cur!==me2[field]){ setErr('Mật khẩu hiện tại không đúng.'); return; }
        await db.doc('students/'+session.ma).update({[field]:form.next});
      }
      setModal(null); await refresh(); alert('Đổi mật khẩu thành công!');
    }
    } catch(e){
      setErr('Không lưu được, vui lòng kiểm tra kết nối mạng và thử lại. ('+(e&&e.message?e.message:'lỗi không rõ')+')');
    }
  }
  async function delViolation(id){ await db.doc('violations/'+id).delete(); setViolations(vs=>vs.filter(v=>v.id!==id)); showToast('Đã xoá ghi nhận ✓'); }
  async function quickChucvu(ma, chucvu){ await db.doc('students/'+ma).update({chucvu}); await refresh(); }

  if(!db) return <div className="wrap"><p className="muted">Đang tải…</p></div>;
  if(!session) return <Login db={db} onLogin={login}/>;

  const me = session.ma ? students.find(s=>s.ma===session.ma) : null;
  const meChucvu = me ? me.chucvu : null;
  const restrictToTo = session.role==='cb' && meChucvu==='to_truong';
  const roleLabel = session.role==='admin'?'Giáo viên chủ nhiệm': session.role==='cb'?(CV_LABEL[meChucvu]||'Cán bộ lớp'): session.role==='ph'?'Phụ huynh':'Học sinh';
  const canEditRoster = session.role==='admin';
  const canLog = session.role==='admin' || session.role==='cb';
  const scopedStudents = restrictToTo ? students.filter(s=>s.to===me.to) : students;
  const scopedMas = new Set(scopedStudents.map(s=>s.ma));
  const scopedViolations = restrictToTo ? violations.filter(v=>scopedMas.has(v.ma)) : violations;

  return (
    <div>
      <div className="top">
        <div className="top1">
          <div className="brandwrap"><span className="logo">🎓</span><div><div className="brand">CSDL Lớp 11A2</div><div className="sub">THPT Cao Bá Quát – Quốc Oai</div></div></div>
          <div className="who">{roleLabel}{me?' · '+me.ten:''}{restrictToTo?' · Tổ '+me.to:''} <button onClick={()=>{setErr('');openModal({type:'changePassword'});}}>🔑 Đổi MK</button> <button onClick={logout}>Đăng xuất</button></div>
        </div>
        {!(session.role==='hs' || session.role==='ph') && <div className="top2"><div className="tabs">
          <div className={"tab "+(tab==='list'?'active':'')} onClick={()=>setTab('list')}>📋 1. Hồ sơ học sinh</div>
          {canLog && <div className={"tab "+(tab==='att'?'active':'')} onClick={()=>setTab('att')}>✅ 2. Điểm danh</div>}
          <div className={"tab "+(tab==='td'?'active':'')} onClick={()=>setTab('td')}>🏆 3. Thi đua</div>
          <div className={"tab "+(tab==='tk'?'active':'')} onClick={()=>setTab('tk')}>📊 4. Tổng kết</div>
          {canEditRoster && <div className={"tab "+(tab==='acc'?'active':'')} onClick={()=>setTab('acc')}>🔐 5. Quản lý tài khoản</div>}
        </div></div>}
      </div>
      <div className="wrap">
        {(session.role==='hs' || session.role==='ph') ? (
          me ? <><StudentSelf s={me} violations={violations} attendance={attendance}/><ThiDuaTab students={students} violations={violations} view="week" canLog={false} weeks={weeks} isAdmin={false}/></> : <p>Không tìm thấy thông tin.</p>
        ) : (
          <>
            {tab==='td' && <div className="tabs sub">
              <div className={"tab "+(tdView==='rules'?'active':'')} onClick={()=>setTdView('rules')}>📕 3.1 Danh mục lỗi</div>
              <div className={"tab "+(tdView==='week'?'active':'')} onClick={()=>setTdView('week')}>📝 3.2 Nhập thi đua theo tuần</div>
              <div className={"tab "+(tdView==='month'?'active':'')} onClick={()=>setTdView('month')}>📅 3.3 Tổng kết thi đua tháng</div>
            </div>}
            {tab==='tk' && <div className="tabs sub">
              <div className={"tab "+(tkView==='month'?'active':'')} onClick={()=>setTkView('month')}>🗓️ 4.1 Tổng kết theo tháng</div>

    return students.filter(s=>(s.ten||'').toLowerCase().includes(k) || (s.ma||'').includes(k) || String(s.to||'').includes(k));

  function exportExcel(){
    const rows = filtered.map(s=>({
      'STT': s.stt, 'Mã định danh': s.ma, 'Họ và tên': s.ten, 'Ngày sinh': s.ngaysinh, 'Giới tính': s.gioitinh,

function AttendanceTab({db, students, attendance, session, onSaved}){
  const [date,setDate] = useState(new Date().toISOString().slice(0,10));
  const dayMap = useMemo(()=>{
    const m = {};
    attendance.filter(a=>a.date===date).forEach(a=>{ m[a.ma]=a.status; });
    return m;
  }, [attendance, date]);
  const [draft,setDraft] = useState({});
  useEffect(()=>{ setDraft({...dayMap}); }, [date]);
  const [saving,setSaving] = useState(false);

  function statusOf(ma){ return draft[ma] ?? dayMap[ma] ?? 'present'; }
  function setStatus(ma, code){ setDraft(d=>({...d, [ma]:code})); }

  const [attErr,setAttErr] = useState('');
  const [q,setQ] = useState('');
  const filtered = useMemo(()=>{
    const k=q.trim().toLowerCase();
    return k ? students.filter(s=>(s.ten||'').toLowerCase().includes(k)) : students;
  }, [students, q]);
  async function save(){
    setSaving(true); setAttErr('');
    try{
      const entries = students.map(s=>({ma:s.ma, status:statusOf(s.ma)}));
      await Promise.all(entries.map(e=>db.doc('attendance/'+date+'_'+e.ma).set({ma:e.ma, date, status:e.status, by:session.role, at:Date.now()})));
      await onSaved();
    } catch(e){
      setAttErr('Không lưu được, kiểm tra kết nối mạng và thử lại.');
    } finally {
      setSaving(false);
    }
  }

  return (
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:8}}>
        <h3>Điểm danh chuyên cần — {viDate(date)}</h3>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <input placeholder="🔍 Tìm tên…" style={{width:'100%',maxWidth:180,minWidth:120}} value={q} onChange={e=>setQ(e.target.value)}/>
          <input type="date" style={{width:'auto'}} value={date} onChange={e=>setDate(e.target.value)}/>
          <button className="btn sec" onClick={()=>exportXlsx(filtered.map(s=>({'STT':s.stt,'Họ tên':s.ten,'Tổ':s.to,'Trạng thái':attInfo(statusOf(s.ma)).label})), 'diem_danh_'+date+'.xlsx', 'Diem danh')}>⬇️ Xuất Excel</button>
          <button className="btn" onClick={save} disabled={saving}>{saving?'Đang lưu…':'Lưu điểm danh'}</button>
        </div>
      </div>
      {attErr && <div className="err" style={{marginBottom:8}}>{attErr}</div>}
      <div className="tbl-wrap"><table>
        <thead><tr><th>STT</th><th>Họ tên</th><th>Tổ</th><th>Trạng thái</th></tr></thead>
        <tbody>
          {filtered.map(s=>{
            const cur = statusOf(s.ma);
            return <tr key={s.ma}>
              <td>{s.stt}</td><td>{s.ten}</td><td>Tổ {s.to??'-'}</td>
              <td>
                <select value={cur} onChange={e=>setStatus(s.ma, e.target.value)}>
                  {ATT_STATUS.map(a=><option key={a.code} value={a.code}>{a.label}</option>)}
                </select>
              </td>
            </tr>;
          })}
        </tbody>
      </table></div>
    </div>
  );
}

function RulesTab({rules, isAdmin, onSaveRules}){
  const [rows,setRows] = useState(rules);
  const [busy,setBusy] = useState(false);
  useEffect(()=>{ setRows(rules); }, [rules]);
  function setField(i,k,v){ setRows(rs=>rs.map((r,idx)=>idx===i?{...r,[k]:v}:r)); }
  function nextCode(){
    const nums = rows.map(r=>parseInt(r.code,10)).filter(n=>!isNaN(n));
    const n = (nums.length?Math.max(...nums):0)+1;
    return String(n).padStart(2,'0');
  }
  function addRule(){ setRows(rs=>[...rs, {code:nextCode(), text:'', diem:-10}]); }
  function delRule(i){ setRows(rs=>rs.filter((_,idx)=>idx!==i)); }
  async function save(){
    setBusy(true);
    try{ await onSaveRules(rows); } finally { setBusy(false); }
  }
  return (
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:8}}>
        <h3>Danh mục lỗi ghi nề nếp ({rows.length} mục)</h3>
        {isAdmin && <div style={{display:'flex',gap:8}}>
          <button className="btn sec" onClick={addRule}>+ Thêm lỗi</button>
          <button className="btn" onClick={save} disabled={busy}>{busy?'Đang lưu…':'Lưu danh mục'}</button>
        </div>}
      </div>
      {isAdmin && <p className="hint">Sửa trực tiếp mã, điểm, tên lỗi bên dưới rồi bấm "Lưu danh mục" — áp dụng ngay cho GVCN, CBL khi ghi nề nếp ở mọi tài khoản.</p>}
      <div className="tbl-wrap"><table>
        <thead><tr><th>Mã lỗi</th><th>Điểm</th><th>Tên lỗi</th>{isAdmin && <th></th>}</tr></thead>
        <tbody>{rows.map((r,i)=>
          <tr key={i}>
            {isAdmin ? <>
              <td><input style={{width:60}} value={r.code} onChange={e=>setField(i,'code',e.target.value)}/></td>
              <td><input type="number" style={{width:80}} value={r.diem} onChange={e=>setField(i,'diem',parseInt(e.target.value,10)||0)}/></td>
              <td><input value={r.text} onChange={e=>setField(i,'text',e.target.value)}/></td>
              <td><button className="link" onClick={()=>delRule(i)}>Xoá</button></td>
            </> : <>
              <td>{r.code}</td>
              <td style={{color:r.diem<0?'var(--bad)':'var(--good)'}}>{r.diem>0?'+':''}{r.diem}</td>
              <td>{r.text}</td>
            </>}
          </tr>
        )}</tbody>
      </table></div>
    </div>
  );
}

function WeekConfigEditor({weeks, onSaveWeeks}){
  const [rows,setRows] = useState(weeks);
  const [open,setOpen] = useState(false);
  const [busy,setBusy] = useState(false);
  useEffect(()=>{ setRows(weeks); }, [weeks]);
  function setField(i,k,v){ setRows(rs=>rs.map((r,idx)=>idx===i?{...r,[k]:v}:r)); }
  function addWeek(){
    const last = rows[rows.length-1];
    const s2 = last ? addDays(last.end,1) : DEFAULT_WEEK_START;
    setRows(rs=>[...rs, {start:s2, end:addDays(s2,6)}]);

  async function save(){ setBusy(true); try{ await onSaveWeeks(rows); } finally { setBusy(false); } }
  return (
    <div className="card" style={{background:'var(--paper)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
        <h3 style={{margin:0}}>⚙️ Cấu hình tuần học ({weeks.length} tuần)</h3>
        <button className="btn sec" onClick={()=>setOpen(v=>!v)}>{open?'Thu gọn':'Chỉnh sửa'}</button>
      </div>
      {open && <>
        <p className="hint">Mỗi tuần có ngày bắt đầu/kết thúc riêng — chỉnh trực tiếp cho khớp lịch thực tế của trường (ví dụ nghỉ Tết, nghỉ lễ). Số tuần trong 1 tháng ở mục 3.2/4.1 sẽ tự tính theo ngày bắt đầu của từng tuần, không cần khai báo riêng.</p>
        <div className="tbl-wrap" style={{maxHeight:320}}><table>
          <thead><tr><th>Tuần</th><th>Ngày bắt đầu</th><th>Ngày kết thúc</th></tr></thead>
          <tbody>{rows.map((r,i)=>
            <tr key={i}>
              <td><b>Tuần {i+1}</b></td>
              <td><input type="date" value={r.start} onChange={e=>setField(i,'start',e.target.value)}/></td>
              <td><input type="date" value={r.end} onChange={e=>setField(i,'end',e.target.value)}/></td>
            </tr>
          )}</tbody>
        </table></div>
        <div className="actions" style={{justifyContent:'space-between'}}>
          <button className="btn sec" onClick={addWeek}>+ Thêm tuần</button>
          <button className="btn" onClick={save} disabled={busy}>{busy?'Đang lưu…':'Lưu cấu hình tuần'}</button>
        </div>
      </>}
    </div>
  );
}

function ThiDuaTab({students, violations, canLog, scopedMas, view, weeks, isAdmin, onSaveWeeks, onAdd, onEditEntry, onDelEntry}){
  const now = new Date();
  const defMonth = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const [month,setMonth] = useState(defMonth);
  const [week,setWeek] = useState(()=> weekNumberOfDate(now.toISOString().slice(0,10), weeks) || 1);
  const canEdit = ma => canLog && scopedMas && scopedMas.has(ma);
  const wr = weekRangeOf(week, weeks);

  const weekRows = useMemo(()=>{
    const list = students.map(s=>({...s, score: weekScore(s.ma, week, violations, weeks)}));
    return withRank(list,'score');
  }, [students, violations, week, weeks]);

  const weekEntries = useMemo(()=>{
    if(!wr) return [];
    return violations.filter(v=>v.date>=wr.start && v.date<=wr.end && (!scopedMas || scopedMas.has(v.ma)));
  }, [violations, wr, scopedMas]);

  const monthWeekNums = useMemo(()=>weeksStartingInMonth(month, weeks), [month, weeks]);
  const monthRows = useMemo(()=>{
    const list = students.map(s=>{
      const ws = monthWeekNums.map(n=>weekScore(s.ma, n, violations, weeks));
      const avg = ws.length ? ws.reduce((a,b)=>a+b,0)/ws.length : 100;
      return {...s, ws, avg};
    });
    return withRank(list,'avg');
  }, [students, violations, monthWeekNums, weeks]);
  const prevMap = useMemo(()=>prevRanks(students, month, violations, weeks), [students, month, violations, weeks]);

  const toRows = useMemo(()=>{
    const groups = {};
    monthRows.forEach(s=>{ const k=s.to??'-'; (groups[k]=groups[k]||[]).push(s.avg); });
    const list = Object.entries(groups).map(([to,arr])=>({to, avg: arr.reduce((a,b)=>a+b,0)/arr.length}));
    return withRank(list,'avg');
  }, [monthRows]);

  const [q,setQ] = useState('');
  const [toF,setToF] = useState('');
  const toOptions = useMemo(()=>[...new Set(students.map(s=>s.to).filter(x=>x!=null))].sort((a,b)=>a-b), [students]);
  const flt = arr => {
    const k=q.trim().toLowerCase();
    return arr.filter(s=>(!k || (s.ten||'').toLowerCase().includes(k)) && (!toF || String(s.to)===toF));
  };
  const weekRowsF = useMemo(()=>flt(weekRows), [weekRows, q, toF]);
  const monthRowsF = useMemo(()=>flt(monthRows), [monthRows, q, toF]);

  const [eq,setEq] = useState('');
  const [eTo,setETo] = useState('');
  // Chỉ tính trùng khi CÙNG học sinh + CÙNG nội dung lỗi + CÙNG ngày
  const entryCounts = useMemo(()=>{
    const m={}; weekEntries.forEach(v=>{ const k=v.ma+'|'+v.text+'|'+v.date; m[k]=(m[k]||0)+1; }); return m;
  }, [weekEntries]);
  const weekEntriesF = useMemo(()=>{
    const k=eq.trim().toLowerCase();
    return weekEntries.filter(v=>{
      const st=students.find(x=>x.ma===v.ma);
      if(eTo && String(st?.to)!==eTo) return false;
      if(k && !((st?.ten||v.ma).toLowerCase().includes(k))) return false;
      return true;
    });
  }, [weekEntries, eq, eTo, students]);

  return (
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:8}}>
        <h3>{view==='week'?'Nhập thi đua theo tuần':'Tổng kết thi đua tháng'} — {view==='week' ? ('Tuần '+week+(wr?' ('+viDate(wr.start)+' – '+viDate(wr.end)+')':'')) : viMonth(month)}</h3>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <input placeholder="🔍 Tìm tên…" style={{width:'100%',maxWidth:160,minWidth:110}} value={q} onChange={e=>setQ(e.target.value)}/>
          <select style={{width:'auto'}} value={toF} onChange={e=>setToF(e.target.value)}>
            <option value="">Tất cả các tổ</option>
            {toOptions.map(t=><option key={t} value={t}>Tổ {t}</option>)}
          </select>
          {view==='week'
            ? <select style={{width:'auto'}} value={week} onChange={e=>setWeek(parseInt(e.target.value,10))}>
                {weeks.map((w,i)=><option key={i} value={i+1}>Tuần {i+1} ({viDate(w.start)}–{viDate(w.end)})</option>)}
              </select>
            : <input type="month" style={{width:'auto'}} value={month} onChange={e=>setMonth(e.target.value)}/>}
          <button className="btn sec" onClick={()=>{
            if(view==='week') exportXlsx(weekRowsF.map(s=>({'STT':s.stt,'Họ tên':s.ten,'Tổ':s.to,'Điểm tuần':s.score,'Xếp loại':xlRank(s.score).label,'Hạng':s.rank})), 'thi_dua_tuan'+week+'.xlsx', 'Tuan '+week);
            else exportXlsx(monthRowsF.map(s=>{ const o={'STT':s.stt,'Họ tên':s.ten,'Tổ':s.to}; s.ws.forEach((v,i)=>o['Tuần '+(monthWeekNums[i])]=v); o['TB tháng']=s.avg.toFixed(1); o['Xếp loại']=xlRank(s.avg).label; o['Hạng']=s.rank; o['Tăng bậc']=bacText(bacValue(prevMap,s.ma,s.rank)); return o; }), 'thi_dua_thang_'+month+'.xlsx', 'Thang');
          }}>⬇️ Xuất Excel</button>
        </div>
      </div>

      {view==='week' && isAdmin && <div style={{marginBottom:14}}><WeekConfigEditor weeks={weeks} onSaveWeeks={onSaveWeeks}/></div>}

      {view==='week' ? (
        <>
        <div className="tbl-wrap"><table>
          <thead><tr><th>STT</th><th>Họ tên</th>{canLog && <th>Thao tác</th>}<th>Tổ</th><th>Điểm tuần</th><th>Xếp loại</th><th>Hạng</th></tr></thead>
          <tbody>{weekRowsF.map(s=>{ const r=xlRank(s.score); const defDate=wr?wr.start:new Date().toISOString().slice(0,10); return <tr key={s.ma}>
            <td>{s.stt}</td><td>{s.ten}</td>
            {canLog && <td>{canEdit(s.ma) && <button className="link" onClick={()=>onAdd(s,defDate)}>+ Ghi nề nếp</button>}</td>}
            <td>Tổ {s.to??'-'}</td><td>{s.score}</td><td><span className={"pill "+r.cls}>{r.label}</span></td><td><b>{s.rank}</b></td>
          </tr>; })}</tbody>
        </table></div>
        {canLog && <>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginTop:18,marginBottom:4}}>
            <h3 style={{margin:0}}>Các ghi nhận trong tuần {week} ({weekEntriesF.length}/{weekEntries.length})</h3>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <input placeholder="🔍 Tìm theo tên…" style={{width:'100%',maxWidth:180,minWidth:120}} value={eq} onChange={e=>setEq(e.target.value)}/>
              <select style={{width:'auto'}} value={eTo} onChange={e=>setETo(e.target.value)}>
                <option value="">Tất cả các tổ</option>
                {toOptions.map(t=><option key={t} value={t}>Tổ {t}</option>)}
              </select>
            </div>
          </div>
          <p className="hint">Cùng học sinh bị ghi <b>cùng một lỗi trong cùng một ngày</b> từ 2 lần trở lên sẽ được tô đậm và đánh dấu ⚠️ để dễ kiểm tra nhập trùng.</p>
          <div className="tbl-wrap"><table>
            <thead><tr><th>Ngày</th><th>Học sinh</th><th>Tổ</th><th>Nội dung</th><th>Điểm</th><th>Ghi chú</th><th>Thao tác</th></tr></thead>
            <tbody>{weekEntriesF.length? weekEntriesF.map(v=>{ const st=students.find(x=>x.ma===v.ma); const dk=v.ma+'|'+v.text+'|'+v.date; const dup=entryCounts[dk]>1; return <tr key={v.id} style={dup?{background:'var(--amberbg)'}:undefined}>
              <td>{viDate(v.date)}</td><td>{dup?'⚠️ ':''}{st?st.ten:v.ma}{dup?' ×'+entryCounts[dk]:''}</td><td>Tổ {st?.to??'-'}</td><td>{v.text}{v.count>1?' (×'+v.count+' lần)':''}</td>
              <td style={{color:v.diem<0?'var(--bad)':'var(--good)'}}>{v.diem>0?'+':''}{v.diem}</td><td className="muted">{v.note||''}</td>
              <td><button className="link" onClick={()=>onEditEntry(v,st)}>Sửa</button> · <button className="link" onClick={()=>onDelEntry(v.id)}>Xoá</button></td>
            </tr>; }) : <tr><td colSpan="7" className="muted">Không có ghi nhận nào khớp bộ lọc.</td></tr>}</tbody>
          </table></div>
        </>}
        </>
      ) : (
        <>
        <div className="tbl-wrap"><table>
          <thead><tr><th>STT</th><th>Họ tên</th><th>Tổ</th>{monthWeekNums.map(n=><th key={n}>Tuần {n}</th>)}<th>TB tháng</th><th>Xếp loại</th><th>Hạng</th><th>Tăng bậc</th></tr></thead>
          <tbody>{monthRowsF.map(s=>{ const r=xlRank(s.avg); return <tr key={s.ma}>
            <td>{s.stt}</td><td>{s.ten}</td><td>Tổ {s.to??'-'}</td>
            {s.ws.map((v,i)=><td key={i}>{v}</td>)}
            <td><b>{s.avg.toFixed(1)}</b></td><td><span className={"pill "+r.cls}>{r.label}</span></td><td><b>{s.rank}</b></td><td><Bac n={bacValue(prevMap,s.ma,s.rank)}/></td>
          </tr>; })}</tbody>
        </table></div>
        <h3 style={{marginTop:18}}>Xếp hạng theo tổ</h3>
        <div className="tbl-wrap"><table>
          <thead><tr><th>Tổ</th><th>Điểm TB tổ</th><th>Hạng</th></tr></thead>
          <tbody>{toRows.map(t=><tr key={t.to}><td>Tổ {t.to}</td><td>{t.avg.toFixed(1)}</td><td><b>{t.rank}</b></td></tr>)}</tbody>
        </table></div>
        </>
      )}
    </div>
  );
}

function SummaryTab({students, violations, attendance, view, weeks}){
  const now = new Date();
  const defMonth = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const [month,setMonth] = useState(defMonth);
  const [sem,setSem] = useState('HK1');
  const mLabel = m => 'Tháng '+parseInt(m.split('-')[1],10);

  const attCount = (ma, months, code) => attendance.filter(a=>a.ma===ma && months.includes(monthOf(a.date)) && a.status===code).length;

  const monthRows = useMemo(()=>{
    const list = students.map(s=>{
      const avg = monthAvg(s.ma, month, violations, weeks);
      return {...s, avg,
        vp: attCount(s.ma,[month],'absent_p'), vk: attCount(s.ma,[month],'absent_k'), muon: attCount(s.ma,[month],'late')};
    });
    return withRank(list,'avg');
  }, [students, violations, attendance, month]);
  const prevMap = useMemo(()=>prevRanks(students, month, violations, weeks), [students, month, violations, weeks]);

  const semMonths = SEMESTERS[sem];
  // Chỉ tính vào điểm học kỳ những tháng đã có dữ liệu ghi nhận
  const activeSem = useMemo(()=>semMonths.filter(m=>violations.some(v=>monthOf(v.date)===m)), [semMonths, violations]);
  const semRows = useMemo(()=>{
    const list = students.map(s=>{
      const ms = semMonths.map(m=> activeSem.includes(m) ? monthAvg(s.ma,m,violations,weeks) : null);
      const vals = ms.filter(x=>x!==null);
      const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 100;
      return {...s, ms, avg,
        vp: attCount(s.ma,semMonths,'absent_p'), vk: attCount(s.ma,semMonths,'absent_k'), muon: attCount(s.ma,semMonths,'late')};
    });
    return withRank(list,'avg');
  }, [students, violations, attendance, sem]);

  const [q,setQ] = useState('');
  const flt = arr => { const k=q.trim().toLowerCase(); return k ? arr.filter(s=>(s.ten||'').toLowerCase().includes(k)) : arr; };
  const monthRowsF = useMemo(()=>flt(monthRows), [monthRows, q]);
  const semRowsF = useMemo(()=>flt(semRows), [semRows, q]);

  function doExport(){
    if(view==='month'){
      exportXlsx(monthRowsF.map(s=>({'STT':s.stt,'Họ tên':s.ten,'Tổ':s.to,'Điểm TB':s.avg.toFixed(1),'Xếp loại':xlRank(s.avg).label,'Hạng':s.rank,'Tăng bậc':bacText(bacValue(prevMap,s.ma,s.rank)),'Vắng phép':s.vp,'Vắng không phép':s.vk,'Đi muộn':s.muon})), 'tong_ket_thang_'+month+'.xlsx', 'Tong ket thang');
    } else {
      exportXlsx(semRowsF.map(s=>{
        const o={'STT':s.stt,'Họ tên':s.ten,'Tổ':s.to};
        semMonths.forEach((m,i)=>{ o[mLabel(m)] = s.ms[i]===null ? '' : s.ms[i].toFixed(1); });
        o['ĐTB học kỳ']=s.avg.toFixed(1); o['Xếp loại']=xlRank(s.avg).label; o['Hạng']=s.rank;
        o['Vắng phép']=s.vp; o['Vắng không phép']=s.vk; o['Đi muộn']=s.muon;
        return o;
      }), 'tong_ket_'+sem+'.xlsx', 'Tong ket hoc ky');
    }
  }

  return (
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:8}}>
        <h3>{view==='month'?'Tổng kết theo tháng — '+viMonth(month):'Tổng kết học kỳ — '+(sem==='HK1'?'Học kỳ 1':'Học kỳ 2')}</h3>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          {view==='month'
            ? <input type="month" style={{width:'auto'}} value={month} onChange={e=>setMonth(e.target.value)}/>
            : <select style={{width:'auto'}} value={sem} onChange={e=>setSem(e.target.value)}>
                <option value="HK1">Học kỳ 1 (tháng 9–12)</option><option value="HK2">Học kỳ 2 (tháng 1–5)</option>
              </select>}
          <input placeholder="🔍 Tìm tên…" style={{width:'100%',maxWidth:180,minWidth:120}} value={q} onChange={e=>setQ(e.target.value)}/>
          <button className="btn sec" onClick={doExport}>⬇️ Xuất Excel</button>
        </div>
      </div>
      {view==='month' ? (
        <div className="tbl-wrap"><table>
          <thead><tr><th>STT</th><th>Họ tên</th><th>Tổ</th><th>Điểm TB</th><th>Xếp loại</th><th>Hạng</th><th>Tăng bậc</th><th>Vắng phép</th><th>Vắng không phép</th><th>Đi muộn</th></tr></thead>
          <tbody>{monthRowsF.map(s=>{ const r=xlRank(s.avg); return <tr key={s.ma}>
            <td>{s.stt}</td><td>{s.ten}</td><td>Tổ {s.to??'-'}</td><td><b>{s.avg.toFixed(1)}</b></td>
            <td><span className={"pill "+r.cls}>{r.label}</span></td><td><b>{s.rank}</b></td><td><Bac n={bacValue(prevMap,s.ma,s.rank)}/></td>
            <td>{s.vp}</td><td>{s.vk}</td><td>{s.muon}</td>
          </tr>; })}</tbody>
        </table></div>
      ) : (
        <div className="tbl-wrap"><table>
          <thead><tr><th>STT</th><th>Họ tên</th><th>Tổ</th>{semMonths.map(m=><th key={m}>{mLabel(m)}</th>)}<th>ĐTB học kỳ</th><th>Xếp loại</th><th>Hạng</th><th>Vắng phép</th><th>Vắng không phép</th><th>Đi muộn</th></tr></thead>
          <tbody>{semRowsF.map(s=>{ const r=xlRank(s.avg); return <tr key={s.ma}>
            <td>{s.stt}</td><td>{s.ten}</td><td>Tổ {s.to??'-'}</td>
            {s.ms.map((v,i)=><td key={i}>{v===null ? <span className="muted">—</span> : v.toFixed(1)}</td>)}
            <td><b>{s.avg.toFixed(1)}</b></td><td><span className={"pill "+r.cls}>{r.label}</span></td><td><b>{s.rank}</b></td>
            <td>{s.vp}</td><td>{s.vk}</td><td>{s.muon}</td>
          </tr>; })}</tbody>
        </table></div>
      )}
    </div>
  );
}

function AccountsTab({students, db, onSaved}){
  const [busy,setBusy] = useState('');
  async function resetPw(ma, field, value){
    setBusy(ma+field);
    await db.doc('students/'+ma).update({[field]:value});
    await onSaved();
    setBusy('');
  }
  async function resetAdminPw(){
    await db.doc('meta/admin').set({pw: ADMIN_PASSWORD});
    alert('Đã đặt lại mật khẩu GVCN về mặc định: '+ADMIN_PASSWORD);
  }
  function exportPasswords(){
    const rows = students.map(s=>({
      'STT': s.stt, 'Họ tên': s.ten, 'Chức vụ': CV_LABEL[s.chucvu]||'',
      'SĐT đăng nhập — Học sinh': s.sdt||'(chưa có)', 'Mật khẩu Học sinh (hiện tại)': s.pw_hs,
      'SĐT đăng nhập — Phụ huynh': s.sdtcha||s.sdtme||s.sdt||'(chưa có)', 'Mật khẩu Phụ huynh (hiện tại)': s.pw_ph
    }));
    exportXlsx(rows, 'tai_khoan_dang_nhap_11A2.xlsx', 'Tai khoan');
  }
  const noPhone = students.filter(s=>!s.sdt);
  return (
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,flexWrap:'wrap',gap:10}}>
        <h3>Quản lý tài khoản</h3>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn sec" onClick={resetAdminPw}>Đặt lại MK GVCN mặc định</button>
          <button className="btn sec" onClick={exportPasswords}>⬇️ Xuất Excel tài khoản</button>
        </div>
      </div>
      <p className="muted">Tên đăng nhập là <b>số điện thoại liên hệ</b> (học sinh/CBL dùng SĐT liên hệ; phụ huynh dùng SĐT cha, mẹ hoặc SĐT liên hệ — số nào đã lưu trong hồ sơ đều đăng nhập được). Mật khẩu hiển thị dưới đây là mật khẩu HIỆN TẠI. Bấm "Đặt lại mặc định" để trả về ngày sinh (học sinh) / SĐT liên hệ (phụ huynh).</p>
      {noPhone.length>0 && <p className="err">⚠️ {noPhone.length} học sinh chưa có SĐT liên hệ ({noPhone.map(s=>s.ten).join(', ')}) — các em này chưa đăng nhập được bằng số điện thoại, vào "Sửa hồ sơ" để bổ sung.</p>}
      <div className="tbl-wrap"><table>
        <thead><tr><th>STT</th><th>Họ tên</th><th>Chức vụ</th><th>SĐT đăng nhập (HS)</th><th>MK Học sinh</th><th>SĐT đăng nhập (PH)</th><th>MK Phụ huynh</th><th>Thao tác</th></tr></thead>
        <tbody>{students.map(s=>{
          const defHs = (s.ngaysinh||'').replace(/\//g,'') || '123456';
          const defPh = s.sdt || '123456';
          return <tr key={s.ma}>
            <td>{s.stt}</td><td>{s.ten}</td><td>{CV_LABEL[s.chucvu]||'-'}</td>
            <td>{s.sdt||<span className="muted">chưa có</span>}</td><td>{s.pw_hs}</td>
            <td>{s.sdtcha||s.sdtme||s.sdt||<span className="muted">chưa có</span>}</td><td>{s.pw_ph}</td>
            <td style={{whiteSpace:'nowrap'}}>
              <button className="link" disabled={busy===s.ma+'pw_hs'} onClick={()=>resetPw(s.ma,'pw_hs',defHs)}>Đặt lại MK HS</button>
              {' · '}
              <button className="link" disabled={busy===s.ma+'pw_ph'} onClick={()=>resetPw(s.ma,'pw_ph',defPh)}>Đặt lại MK PH</button>
            </td>
          </tr>;
        })}</tbody>
      </table></div>
    </div>
  );
}

function StudentSelf({s, violations, attendance}){
  const myV = violations.filter(v=>v.ma===s.ma);
  const t = totalOf(s.ma, violations); const r = xlRank(t);
  const myAtt = attendance.filter(a=>a.ma===s.ma);
  const cnt = code => myAtt.filter(a=>a.status===code).length;
  const stats = [
    {label:'Vắng có phép', n:cnt('absent_p'), cls:'mid'},
    {label:'Vắng không phép', n:cnt('absent_k'), cls:'bad'},
    {label:'Đi muộn', n:cnt('late'), cls:'mid'},
    {label:'Có mặt', n:cnt('present'), cls:'good'},
  ];
  const byType = useMemo(()=>{
    const groups = {};
    myV.filter(v=>v.diem<0).forEach(v=>{ const k=v.text; groups[k]=groups[k]||{text:k,n:0,diem:0}; groups[k].n++; groups[k].diem+=v.diem; });
    return Object.values(groups).sort((a,b)=>b.n-a.n);
  }, [myV]);
  return (
    <>
      <div className="card">
        <h2>{s.ten}</h2>
        <p className="muted">Mã định danh: {s.ma} · Tổ {s.to??'-'} · {s.gioitinh||''} · Sinh {s.ngaysinh||''}</p>
        <div className="row2" style={{alignItems:'center',marginTop:10}}>
          <div><div className="score">{t}</div><span className={"pill "+r.cls}>{r.label}</span></div>
          <div className="muted">Điểm nề nếp tính từ 100, cộng/trừ theo các lượt ghi nhận bên dưới.</div>
        </div>
      </div>
      <div className="card">
        <h3>Chuyên cần</h3>
        <div style={{display:'flex',gap:20,flexWrap:'wrap',marginTop:6}}>
          {stats.map(x=><div key={x.label}><div className="score" style={{fontSize:24}}>{x.n}</div><span className={"pill "+x.cls}>{x.label}</span></div>)}
        </div>
      </div>
      <div className="card">
        <h3>Thống kê lỗi vi phạm</h3>
        {byType.length ? (
          <div className="tbl-wrap"><table>
            <thead><tr><th>Loại lỗi</th><th>Số lần</th><th>Tổng điểm trừ</th></tr></thead>
            <tbody>{byType.map(x=><tr key={x.text}><td>{x.text}</td><td>{x.n}</td><td style={{color:'var(--bad)'}}>{x.diem}</td></tr>)}</tbody>
          </table></div>
        ) : <p className="muted">Chưa vi phạm lỗi nào — rất tốt!</p>}
      </div>
      <div className="card">
        <h3>Lịch sử nề nếp</h3>
        <div className="tbl-wrap"><table>
          <thead><tr><th>Ngày</th><th>Nội dung</th><th>Điểm</th><th>Ghi chú</th></tr></thead>
          <tbody>
            {myV.length ? myV.map(v=><tr key={v.id}><td>{viDate(v.date)}</td><td>{v.text}</td><td style={{color:v.diem<0?'var(--bad)':'var(--good)'}}>{v.diem>0?'+':''}{v.diem}</td><td className="muted">{v.note||''}</td></tr>)
              : <tr><td colSpan="4" className="muted">Chưa có ghi nhận nào — điểm tuyệt đối!</td></tr>}
          </tbody>
        </table></div>
      </div>

}
